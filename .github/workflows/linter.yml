---
name: 'Lint'
on:
  push:
    branches:
      - 'trunk'
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - 'CONTRIBUTING.md'
      - 'LICENSE-3rdparty.csv'
      - 'LICENSE.md'
      - 'NOTICE'
      - 'README.md'
      - 'license-3rdparty.tpl'
  pull_request:
    branches:
      - 'trunk'
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - 'CONTRIBUTING.md'
      - 'LICENSE-3rdparty.csv'
      - 'LICENSE.md'
      - 'NOTICE'
      - 'README.md'
      - 'license-3rdparty.tpl'

permissions:
  contents: 'read'

jobs:
  go:
    name: 'Lint Go files'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1'

      - name: 'Setup Go environment'
        uses: 'actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0'
        with:
          go-version: '1.24.x'

      - name: 'Run govulncheck'
        run: 'make vulnerabilities'

      - name: 'Run gofumpt'
        run: 'make fmt'

      - name: 'Run golangci-lint'
        run: 'make lint'
