---
name: 'Tests'
on:
  push:
    branches:
      - 'trunk'
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '.golangci.yml'
      - 'CONTRIBUTING.md'
      - 'LICENSE-3rdparty.csv'
      - 'LICENSE.md'
      - 'NOTICE'
      - 'README.md'
      - 'license-3rdparty.tpl'
  pull_request:
    branches:
      - 'trunk'
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '.golangci.yml'
      - 'CONTRIBUTING.md'
      - 'LICENSE-3rdparty.csv'
      - 'LICENSE.md'
      - 'NOTICE'
      - 'README.md'
      - 'license-3rdparty.tpl'

jobs:
  test:
    runs-on: 'ubuntu-latest'
    name: 'Tests'
    steps:
      - uses: 'actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1'

      - name: 'Setup Go environment'
        uses: 'actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0'
        with:
          go-version: '1.24.x'

      - name: 'Run tests'
        run: 'make test'

      - name: 'Run build'
        run: 'make build'
